name: Nightly Platform Conformance (Live)

# Amendment 6: scheduled ONLY. Never a PR/CI gate — a live model call with a real
# provider key. It ALERTS (non-zero exit) ONLY on dialect marker/banned-token
# drift, never on latency. The drift report is uploaded as a workflow artifact.
on:
  schedule:
    - cron: '30 3 * * *' # 03:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: platform-conformance-live
  cancel-in-progress: true

jobs:
  live-conformance:
    name: Real agent export across the 9 registry targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run live platform conformance (alerts only on marker/ban drift)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PLATFORM_CONFORMANCE_PROVIDER: ${{ vars.PLATFORM_CONFORMANCE_PROVIDER }}
          PLATFORM_CONFORMANCE_MODEL: ${{ vars.PLATFORM_CONFORMANCE_MODEL }}
        run: npm run test:platform-conformance:live

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-conformance-live
          path: docs/traces/platform-conformance-live.json
          if-no-files-found: ignore
