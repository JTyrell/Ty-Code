name: Build & Release Ty-Code

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test & Quality Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suites (Phases 2-7)
        run: npm test

      - name: Build Application
        run: npm run build

  build-cross-platform:
    name: Package for ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: win
            artifact_name: Ty-Code-Windows
            artifact_path: |
              dist-release/*.exe
              dist-release/*.yml
              dist-release/*.blockmap
          - os: macos-latest
            platform: mac
            artifact_name: Ty-Code-macOS
            artifact_path: |
              dist-release/*.dmg
              dist-release/*.zip
              dist-release/*.yml
              dist-release/*.blockmap
          - os: ubuntu-latest
            platform: linux
            artifact_name: Ty-Code-Linux
            artifact_path: |
              dist-release/*.AppImage
              dist-release/*.deb
              dist-release/*.rpm
              dist-release/*.yml
              dist-release/*.blockmap

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux System Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install Node Dependencies
        run: npm ci

      - name: Ensure release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || { echo "Release tag $tag_version does not match package.json version $package_version." >&2; exit 1; }

      - name: Require Windows signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          test -n "$WIN_CSC_LINK" && test -n "$WIN_CSC_KEY_PASSWORD" || { echo "Set WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD before creating a release tag." >&2; exit 1; }

      - name: Require Apple signing and notarization secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MAC_CSC_LINK" && test -n "$MAC_CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Set all MAC_CSC_* and APPLE_* secrets before creating a release tag." >&2; exit 1; }

      - name: Package with electron-builder (${{ matrix.platform }})
        env:
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:${{ matrix.platform }}

      - name: Upload Packaging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-cross-platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Ty-Code-Windows
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Ty-Code-macOS
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Ty-Code-Linux
          path: release-assets

      - name: Generate Checksums
        run: |
          cd release-assets
          if [ -z "$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print -quit)" ]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          sha256sum * > SHA256SUMS.txt

      - name: Generate Release Notes
        id: release_notes
        env:
          TY_CODE_RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/generate-release-notes.mjs > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
