name: Security and Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-build:
    name: Dependency and production build checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

      - name: Check unused direct dependencies
        run: npx --yes depcheck@1.4.7

      - name: Run regression and security tests
        run: npm test

      - name: Build Electron production assets
        run: npm run build

      - name: Scan bundles for baked credentials
        run: npm run test:no-baked-secrets

      - name: Build Cloudflare Pages website
        run: npm run build:website
