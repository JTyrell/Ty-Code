appId: com.tycode.app
productName: Ty-Code
copyright: Copyright © 2026 Ty-Code Team

directories:
  output: dist-release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/*.map"
  - "!node_modules/*-test*/**"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node-pty/**"

extraMetadata:
  main: dist/main/index.js

protocols:
  - name: Ty-Code Protocol
    schemes:
      - ty-code

fileAssociations:
  - ext:
      - ts
      - tsx
      - js
      - jsx
      - py
      - json
      - md
    name: Code Document
    role: Editor

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  legalTrademarks: Ty-Code
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ty-Code
  deleteAppDataOnUninstall: false
  runAfterFinish: true

mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

dmg:
  background: null
  backgroundColor: "#121316"
  window:
    width: 540
    height: 380

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Development
  desktop:
    StartupWMClass: ty-code
    MimeType: text/plain;text/x-typescript;text/x-javascript;text/x-python;application/json;

publish:
  provider: github
  owner: ty-code
  repo: ty-code
  releaseType: release
