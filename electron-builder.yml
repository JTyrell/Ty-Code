appId: com.tycode.app
productName: Ty-Code
copyright: Copyright © 2026 Ty-Code Team

directories:
  output: dist-release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/*.map"
  - "!node_modules/*-test*/**"

extraResources:
  - from: build/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/node-pty/prebuilds/**"
  - "**/node-pty/build/Release/**"

extraMetadata:
  main: dist/main/index.js

protocols:
  - name: Ty-Code Protocol
    schemes:
      - ty-code

fileAssociations:
  - ext:
      - ts
      - tsx
      - js
      - jsx
      - py
      - json
      - md
    name: Code Document
    role: Editor

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  legalTrademarks: Ty-Code
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: true
  artifactName: Ty-Code-${version}-${arch}.${ext}

nsis:
  artifactName: Ty-Code-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ty-Code
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: Ty-Code-${version}-portable.${ext}

mac:
  icon: icon.png
  artifactName: Ty-Code-${version}-mac.${ext}
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

dmg:
  background: null
  backgroundColor: "#121316"
  window:
    width: 540
    height: 380

linux:
  maintainer: Ty-Code Team <team@ty-code.com>
  icon: icons/
  artifactName: Ty-Code-${version}-x64.${ext}
  target:
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Development

deb:
  artifactName: Ty-Code-${version}-x64.${ext}

rpm:
  artifactName: Ty-Code-${version}-x64.${ext}

generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: ty-code
  repo: ty-code
  releaseType: release
  # electron-builder-generated latest*.yml files embed SHA-512 artifact checksums.
  # CI additionally ships SHA256SUMS.txt covering every release asset.
