appId: com.tycode.app
productName: Ty-Code
copyright: Copyright © 2026 Ty-Code Team

directories:
  output: dist-release
  buildResources: build

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/*.map"
  - "!node_modules/*-test*/**"

extraResources:
  - from: build/icon.png
    to: icon.png
  # Voice engine (faster-whisper sidecar): everything is bundled, zero runtime
  # downloads. Layout is produced by `npm run prepare:voice-engine`.
  - from: resources/voice-engine/python
    to: voice-engine/python
  - from: resources/voice-engine/site-packages
    to: voice-engine/site-packages
  - from: src/main/services/voice-engine/transcriber.py
    to: voice-engine/transcriber.py
  - from: resources/voice-engine/models
    to: voice-engine/models

asar: true
asarUnpack:
  - "**/node-pty/prebuilds/**"
  - "**/node-pty/build/Release/**"
  # Worker threads and forked sandbox children must be real files on disk;
  # worker_threads cannot load JS module code from inside the asar archive.
  - "**/dist/main/workers/**"

extraMetadata:
  main: dist/main/index.js

protocols:
  - name: Ty-Code Protocol
    schemes:
      - ty-code

fileAssociations:
  - ext:
      - ts
      - tsx
      - js
      - jsx
      - py
      - json
      - md
    name: Code Document
    role: Editor

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  legalTrademarks: Ty-Code
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: false
  artifactName: Ty-Code-${version}-${arch}.${ext}

nsis:
  include: build/installer.nsh
  artifactName: Ty-Code-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ty-Code
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: Ty-Code-${version}-portable.${ext}

mac:
  icon: icon.png
  artifactName: Ty-Code-${version}-mac.${ext}
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folders
        CFBundleTypeRole: Editor
        LSItemContentTypes:
          - public.folder
        LSHandlerRank: Alternate

dmg:
  background: null
  backgroundColor: "#121316"
  window:
    width: 540
    height: 380

linux:
  maintainer: Ty-Code Team <team@ty-code.com>
  icon: icons/
  artifactName: Ty-Code-${version}-x64.${ext}
  target:
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: appimage
      arch:
        - x64
  category: Development
  desktop:
    MimeType: "inode/directory;"
    Terminal: "false"

deb:
  artifactName: Ty-Code-${version}-x64.${ext}

rpm:
  artifactName: Ty-Code-${version}-x64.${ext}

generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: JTyrell
  repo: Ty-Code
  releaseType: release
  # electron-builder-generated latest*.yml files embed SHA-512 artifact checksums.
  # CI additionally ships SHA256SUMS.txt covering every release asset.
